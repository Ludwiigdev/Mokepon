<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mokepon</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./animations.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <section id="seleccionar-mascota">
      <h1 class="titulo">Mokepon</h1>

      <h2 class="subtitulo">Elige tu mascota:</h2>

      <div id="contenedorTarjetas" class="tarjetas"></div>

      <button id="boton-mascota">Seleccionar</button>
    </section>

    <section id="ver-mapa">
      <h2 class="subtitulo">Recorre el mapa con tu mokepon</h2>
      <canvas id="mapa"></canvas>
      <div class="controles-mapa">
        <button class="btn-up" onmouseup="detenerMovimiento()" onmousedown="moverArriba()">Arriba</button>
        <button class="btn-left" onmouseup="detenerMovimiento()" onmousedown="moverIzquierda()">Izquierda</button>
        <button class="btn-down" onmouseup="detenerMovimiento()" onmousedown="moverAbajo()">Abajo</button>
        <button class="btn-right" onmouseup="detenerMovimiento()" onmousedown="moverDerecha()">Derecha</button>
      </div>
    </section>

    <section id="seleccionar-ataque">
      <h1 class="titulo">Mokepon</h1>

      <h2 id="contenedorAtaques" class="subtitulo">Elige tu ataque:</h2>

      <div class="tarjetas-ataques"></div>

      <div id="mensajes">
        <p id="resultado">Mucha suerte</p>

        <section id="reiniciar">
          <button id="boton-reiniciar">Reiniciar</button>
        </section>
      </div>

      <div class="ataques">
        <div class="ataques-jugador">
          <p id="vidas-jugador">0</p>
          <p id="mascota-jugador"></p>
          <div id="ataques-del-jugador"></div>
        </div>
        <div class="ataques-enemigo">
          <p id="vidas-enemigo">0</p>
          <p id="mascota-enemigo"></p>
          <div id="ataques-del-enemigo"></div>
        </div>
      </div>
    </section>
    <script type="module" src="./js/mokeponData.js"></script>
    <script type="module" src="./js/mokepon.js"></script>
  </body>
</html>
